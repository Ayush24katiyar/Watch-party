services:
  postgres:
    # Alpine variant: ~80MB smaller image than the Debian one.
    image: postgres:16-alpine
    container_name: watch-party-db
    restart: unless-stopped

    # Hard cap on container RAM (Compose honors deploy.resources outside Swarm too).
    # Postgres defaults assume a big machine; shared_buffers 128MB keeps it quiet.
    shm_size: 128mb
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - wal_compression=on
    deploy:
      resources:
        limits:
          memory: 512m
        reservations:
          memory: 128m

    # Localhost-only binding; matches DATABASE_URL in .env.
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: watch
      POSTGRES_PASSWORD: watch
      POSTGRES_DB: watchparty
    volumes:
      - postgres-data:/var/lib/postgresql/data

    # Keep container logs from growing unbounded (default json-file has no cap).
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U watch -d watchparty"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
