[project]
name = "watch-party"
version = "0.1.0"
description = "Real-time YouTube watch party with WebSocket sync"
readme = "README.md"
authors = [
    { name = "Ayush Katiyar", email = "ayush24katiyar@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "fastapi[standard]>=0.143.0",
    "pydantic-settings>=2.15.0",
    "sqlalchemy[asyncio]>=2.1.4",
]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "jscpd>=5.4.1",
    "pip-audit>=2.10.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-randomly>=5.0.0",
    "pytest-timeout>=2.4.0",
]

# Makes `uv run fastapi dev` (no path argument) import our app: watch_party.main:app
[tool.fastapi]
entrypoint = "watch_party.main:app"

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
# A hung test fails with a thread dump instead of freezing the suite.
timeout = 30
timeout_method = "thread"
faulthandler_timeout = 20
markers = [
    "spec_question: spec is silent or ambiguous; test asserts the most defensible reading",
]
